{% extends "base.html" %}
{% block title %}Tải lên – KomicLib{% endblock %}

{% block body %}
<div class="container" style="max-width:700px;padding:2rem 1rem">
  <h2 class="mb-4" style="font-weight:700">
    <i class="bi bi-cloud-upload me-2" style="color:var(--primary)"></i>Tải lên tài liệu
  </h2>

  <form id="uploadForm" method="POST" action="{{ url_for('upload.do_upload') }}" enctype="multipart/form-data">

    <!-- Drop zone -->
    <div class="drop-zone" id="dropZone">
      <div class="icon"><i class="bi bi-cloud-arrow-up"></i></div>
      <p style="font-size:1.1rem;font-weight:600">Kéo thả file vào đây hoặc nhấn để chọn</p>
      <p style="color:var(--text-muted);font-size:0.9rem">Hỗ trợ: .cbz, .pdf, .docx, .epub · Tối đa 500MB mỗi file</p>
      <input type="file" id="fileInput" name="files" multiple accept=".cbz,.pdf,.docx,.epub" style="display:none">
    </div>

    <!-- File list preview -->
    <div id="fileList" class="file-list"></div>

    <!-- Metadata (optional) -->
    <div class="mt-4" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem">
      <h6 style="color:var(--text-muted);text-transform:uppercase;font-size:0.75rem;letter-spacing:.08em;margin-bottom:1rem">
        Thông tin bổ sung (tuỳ chọn)
      </h6>

      <div class="mb-3">
        <label class="form-label" style="font-size:0.85rem;color:var(--text-muted)">Thể loại</label>
        <select name="genre_id" class="filter-select">
          <option value="">-- Chọn thể loại --</option>
          {% for g in genres %}
          <option value="{{ g.id }}">{{ g.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label" style="font-size:0.85rem;color:var(--text-muted)">Hoặc tạo thể loại mới</label>
        <input type="text" name="custom_genre" class="filter-input" placeholder="Nhập tên thể loại…">
      </div>
    </div>

    <!-- Progress bar -->
    <div id="uploadProgress" style="display:none;margin-top:1rem">
      <div class="progress" style="height:6px;background:var(--border);border-radius:3px">
        <div id="progressBar" class="progress-bar" role="progressbar" style="width:0%;background:var(--primary)"></div>
      </div>
      <p id="progressText" style="font-size:0.85rem;color:var(--text-muted);margin-top:0.5rem;text-align:center"></p>
    </div>

    <div class="d-flex gap-3 mt-4">
      <button type="submit" class="btn-primary-custom" id="uploadBtn" disabled>
        <i class="bi bi-upload me-1"></i>Tải lên
      </button>
      <a href="{{ url_for('library.index') }}" class="btn-ghost">Quay lại</a>
    </div>

  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
const dropZone  = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList  = document.getElementById('fileList');
const uploadBtn = document.getElementById('uploadBtn');
const form      = document.getElementById('uploadForm');

const ALLOWED = ['cbz','pdf','docx','epub'];

function getExt(name) { return name.split('.').pop().toLowerCase(); }
function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024**2) return (b/1024).toFixed(1) + ' KB';
  return (b/1024**2).toFixed(1) + ' MB';
}

function updateFileList(files) {
  fileList.innerHTML = '';
  let valid = 0;
  Array.from(files).forEach(f => {
    const ok = ALLOWED.includes(getExt(f.name));
    if (ok) valid++;
    const div = document.createElement('div');
    div.className = 'file-item';
    div.innerHTML = `
      <i class="bi bi-file-earmark${ok ? '' : '-x'}" style="color:${ok?'var(--success)':'var(--danger)'}"></i>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>
      <span style="color:var(--text-muted);font-size:0.8rem">${fmtSize(f.size)}</span>
      <span class="status" style="color:${ok?'var(--success)':'var(--danger)'}">
        ${ok ? '<i class="bi bi-check-circle"></i>' : '<i class="bi bi-x-circle"></i> Không hỗ trợ'}
      </span>`;
    fileList.appendChild(div);
  });
  uploadBtn.disabled = valid === 0;
}

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => updateFileList(fileInput.files));

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const dt = new DataTransfer();
  Array.from(e.dataTransfer.files).forEach(f => dt.items.add(f));
  fileInput.files = dt.files;
  updateFileList(fileInput.files);
});

// Ajax upload with progress
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!fileInput.files.length) return;

  const progress = document.getElementById('uploadProgress');
  const bar      = document.getElementById('progressBar');
  const text     = document.getElementById('progressText');
  progress.style.display = 'block';
  uploadBtn.disabled = true;

  const fd = new FormData(form);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', form.action);
  xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');

  xhr.upload.addEventListener('progress', ev => {
    if (ev.lengthComputable) {
      const pct = Math.round(ev.loaded / ev.total * 100);
      bar.style.width = pct + '%';
      text.textContent = `Đang tải lên… ${pct}%`;
    }
  });

  xhr.addEventListener('load', () => {
    bar.style.width = '100%';
    text.textContent = 'Xử lý xong!';
    try {
      const res = JSON.parse(xhr.responseText);
      fileList.innerHTML = '';
      res.forEach(r => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
          <i class="bi bi-${r.ok ? 'check-circle' : 'x-circle'}" style="color:${r.ok?'var(--success)':'var(--danger)'}"></i>
          <span>${r.name}</span>
          <span class="status" style="color:${r.ok?'var(--success)':'var(--danger)'}">${r.msg}</span>`;
        fileList.appendChild(div);
      });
      setTimeout(() => window.location.href = '/', 1500);
    } catch {
      window.location.href = '/';
    }
  });

  xhr.addEventListener('error', () => {
    text.textContent = 'Lỗi tải lên!';
    text.style.color = 'var(--danger)';
    uploadBtn.disabled = false;
  });

  xhr.send(fd);
});
</script>
{% endblock %}
